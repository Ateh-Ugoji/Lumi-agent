[project]
name = "lumi"
version = "0.1.0"
description = "Chat-based social listening and caption repurpose agent for X"
authors = [
    { name = "gbemike", email = "gbemike2002@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "celery>=5.6.3",
    "chromadb>=1.5.9",
    "cryptography>=50.0.2",
    "django>=5.2,<5.3",
    "django-cors-headers>=4.9.0",
    "djangorestframework>=3.18.3",
    "drf-spectacular>=0.30.0",
    "fastapi>=0.143.0",
    "greenlet>=3.5.6",
    "httpx>=0.28.1",
    "httpx2>=2.13.1",
    "mcp==2.3.0",
    "neatlogs>=1.4.26",
    "openai>=3.28.0",
    "psycopg2-binary>=2.9.13",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic>=2.14.0",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "redis>=8.1.0",
    "sqlmodel>=0.0.48",
    "typesafe-sdk>=0.7.4",
    "uvicorn[standard]>=0.54.0",
    "whitenoise>=6.12.0",
]

[tool.uv]
package = false

[tool.ruff]
# ``app`` (the old FastAPI code) lives in legacy/, so isort must still see it as first party.
src = [".", "legacy"]
extend-exclude = ["legacy/alembic/versions", "apps/*/migrations"]

[tool.ruff.lint.per-file-ignores]
"apps/**/models.py" = ["RUF012"]  # Django Meta and class attributes
"apps/**/{views,serializers,tests/*}.py" = ["RUF012"]  # DRF class attributes

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
DJANGO_SETTINGS_MODULE = "config.settings.test"
markers = [
    "live: llama a un servicio real y necesita keys en lumi/.env (se omite salvo LUMI_RUN_LIVE=1)",
]
python_files = ["test_*.py"]
testpaths = ["apps"]
# lumi/legacy is the old FastAPI backend, kept as reference. It has its own pytest.ini and is run by
# hand (see legacy/README.md). These are pytest's default ignores plus legacy.
norecursedirs = ["*.egg", ".*", "_darcs", "build", "CVS", "dist", "node_modules", "venv", "{arch}", "legacy"]

[dependency-groups]
dev = [
    "factory-boy>=3.3.3",
    "pgserver>=0.1.4",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.0",
]
