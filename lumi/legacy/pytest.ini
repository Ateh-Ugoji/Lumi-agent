[pytest]
# The old tests use SQLite and no Django: pytest-django would ask for DATABASE_URL.
addopts = -p no:django
asyncio_mode = auto
# legacy/ for ``app``; lumi/ for ``mvp`` (the handle-search MVP, which a legacy test imports)
pythonpath = . ..
markers =
    live: llama a un servicio real y necesita keys en lumi/.env (se omite salvo LUMI_RUN_LIVE=1)
python_files = test_*.py
testpaths = tests
